[project]
name = "sheetgen"
version = "0.1.0"
description = "Grammar-based input generators and trial analysis for the sheet fuzzing exercise"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "polars>=1.0",
    "scipy>=1.13",
]

[project.scripts]
sheetgen = "sheetgen.cli:main"
sheet-plots = "sheetanalysis.plots:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetgen", "src/sheetanalysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PIE", "RET"]

[tool.mypy]
strict = true
packages = ["sheetgen", "sheetanalysis"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
