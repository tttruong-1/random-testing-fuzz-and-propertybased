[project]
name = "pbt"
version = "0.1.0"
description = "Property-based testing tasks for CMPT 473 Exercise 4"
requires-python = ">=3.12"
dependencies = ["hypothesis>=6.100"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PIE", "RET"]

[tool.mypy]
strict = true
packages = ["pbt"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
